name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --release
      - run: cargo clippy --locked --all-targets --features opus -- -D warnings
      - run: cargo test --locked --features opus
      - run: cargo test --locked --release --features opus
      - run: cargo test --locked --release --features opus --example opus_roundtrip
      - run: python -m unittest discover -s tools/reference -p test_check_opus_vectors.py
      - run: python -m unittest discover -s tools -p test_smoke_call.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo clippy --locked --all-targets --features live-audio -- -D warnings
      - run: cargo test --locked --features live-audio --example monitor
      - run: cargo clippy --locked --all-targets --features internet-call -- -D warnings
      - run: cargo test --locked --features internet-call --example call --example call_relay
      - run: cargo build --locked --release --features internet-call --example call --example call_relay
      - run: python tools/smoke_call.py

  mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android
      - run: cargo check --locked --lib --target aarch64-apple-ios
      - run: cargo check --locked --lib --target aarch64-apple-ios-sim
      - run: cargo check --locked --lib --target aarch64-linux-android
      - run: cargo check --locked --lib --features opus --target aarch64-apple-ios
      - run: cargo check --locked --lib --features opus --target aarch64-apple-ios-sim
      - run: cargo check --locked --lib --features opus --target aarch64-linux-android

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo fuzz run packet -- -max_total_time=30 -max_len=1024
      - run: cargo fuzz run entropy -- -max_total_time=30 -max_len=4096
      - run: cargo fuzz run opus -- -max_total_time=30 -max_len=4096

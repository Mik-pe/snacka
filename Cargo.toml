[package]
name = "snacka"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Independent Rust audio codec development"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/Mik-pe/snacka"
keywords = ["audio", "speech", "realtime", "codec", "voip"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = [
    "/.github/**",
    "/docs/measurements/**",
    "/tools/**",
    "/target-mobile/**",
]

[features]
default = []
reference-tests = []
opus = []
live-audio = ["dep:cpal", "dep:crossterm", "dep:ratatui", "dep:rtrb", "dep:rubato"]
call-transport = ["dep:chacha20poly1305", "dep:getrandom", "dep:ctrlc"]
internet-call = ["live-audio", "call-transport", "dep:sonora"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
rtrb = { version = "0.3.2", optional = true }
rubato = { version = "5.0.1", default-features = false, optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }
getrandom = { version = "0.4.2", optional = true }
ctrlc = { version = "3.5.2", optional = true }
sonora = { version = "0.2.0", optional = true }

[[example]]
name = "monitor"
required-features = ["live-audio"]

[[example]]
name = "opus_roundtrip"
required-features = ["opus"]

[[example]]
name = "opus_call"
required-features = ["opus"]

[[example]]
name = "call"
path = "examples/call/main.rs"
required-features = ["internet-call"]

[[example]]
name = "call_relay"
path = "examples/call_relay/main.rs"
required-features = ["call-transport"]

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "opus"
harness = false
required-features = ["opus"]

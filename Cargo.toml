[package]
name = "snacka"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Independent Rust audio codec development"
license = "MIT"
repository = "https://github.com/Mik-pe/snacka"
keywords = ["audio", "speech", "realtime", "codec", "voip"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = ["/target-mobile/**"]

[features]
default = []
reference-tests = []
live-audio = ["dep:cpal", "dep:crossterm", "dep:ratatui", "dep:rtrb", "dep:rubato"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
rtrb = { version = "0.3.2", optional = true }
rubato = { version = "5.0.1", default-features = false, optional = true }

[[example]]
name = "monitor"
required-features = ["live-audio"]

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true

[[bench]]
name = "kernels"
harness = false
